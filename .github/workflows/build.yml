name: build

# Builds all projects for Linux and for Windows (MinGW cross-compile) on every push and pull request.
# A tag v* also packages the current remakes for Windows and publishes them as a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Linux (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 60
    steps:
      - name: Install packages
        run: dnf -y install --setopt=install_weak_deps=False gcc-c++ cmake ninja-build pkgconf-pkg-config SDL3-devel libopenmpt-devel

      - uses: actions/checkout@v4

      - name: Build 303 remake
        run: |
          cmake -S 303/remake -B 303/remake/build-ci-linux -G Ninja
          cmake --build 303/remake/build-ci-linux

      - name: Build 303 remake v1
        run: |
          cmake -S 303/remake-v1 -B 303/remake-v1/build-ci-linux -G Ninja
          cmake --build 303/remake-v1/build-ci-linux

      - name: Build Paper remake
        run: |
          cmake -S paper/remake -B paper/remake/build-ci-linux -G Ninja
          cmake --build paper/remake/build-ci-linux

      - name: Build JIZZ remake
        run: |
          cmake -S jizz/remake -B jizz/remake/build-ci-linux -G Ninja
          cmake --build jizz/remake/build-ci-linux

  windows:
    name: Windows x64 (MinGW)
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 60
    steps:
      # Fedora has no MinGW libopenmpt: the 303 builds compile it from its pinned source release (cmake/libopenmpt.cmake).
      - name: Install packages
        run: dnf -y install --setopt=install_weak_deps=False cmake ninja-build mingw64-gcc-c++ mingw64-binutils mingw64-SDL3 mingw64-winpthreads-static

      - uses: actions/checkout@v4

      - name: Build 303 remake
        run: |
          mingw64-cmake -S 303/remake -B 303/remake/build-ci-win -G Ninja
          cmake --build 303/remake/build-ci-win

      - name: Build 303 remake v1
        run: |
          mingw64-cmake -S 303/remake-v1 -B 303/remake-v1/build-ci-win -G Ninja
          cmake --build 303/remake-v1/build-ci-win

      - name: Build Paper remake
        run: |
          mingw64-cmake -S paper/remake -B paper/remake/build-ci-win -G Ninja
          cmake --build paper/remake/build-ci-win

      - name: Build JIZZ remake
        run: |
          mingw64-cmake -S jizz/remake -B jizz/remake/build-ci-win -G Ninja
          cmake --build jizz/remake/build-ci-win

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="$GITHUB_REF_NAME"; else export VERSION="development build ${GITHUB_SHA::7}"; fi
          bash scripts/package-windows.sh 303 303/remake/build-ci-win out
          bash scripts/package-windows.sh paper paper/remake/build-ci-win out
          bash scripts/package-windows.sh jizz jizz/remake/build-ci-win out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
