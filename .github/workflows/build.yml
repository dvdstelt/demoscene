name: build

# Builds the remakes for Linux and Windows (MinGW cross-compile) and packages them as downloads, one job per project
# and system:
#   - a push or pull request builds only the projects whose files changed (scripts/ci-plan.sh decides);
#   - a tag <demo>-v<version>, such as paper-v1.0, builds that demo and publishes its downloads as a GitHub Release
#     (scripts/ci-release.sh);
#   - "Run workflow" in the Actions tab builds the projects you name, or all of them.
# Every build's downloads are kept with the run as artifacts.

on:
  push:
    branches: ['**']
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to build: all, or names from 303 303-v1 paper jizz stars dope clone inside reve vividexp'
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the commits to compare with
          filter: blob:none       # but not the pictures: comparing needs only the file lists

      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_PROJECTS: ${{ inputs.projects }}
        run: bash scripts/ci-plan.sh | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.project }}
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    runs-on: ubuntu-latest
    # AlmaLinux 9 has glibc 2.34, so the program runs on the Linux distributions of the last years. gcc-toolset gives
    # a current compiler; the parts of its C++ library that the system's libstdc++ lacks are linked into the program.
    # SDL3 is built from source with the X11, Wayland and sound headers below and linked in (ci-build.sh).
    container: almalinux:9
    timeout-minutes: 60
    steps:
      - name: Install packages
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install --setopt=install_weak_deps=False \
            gcc-toolset-14-gcc-c++ gcc-toolset-14-binutils cmake ninja-build ccache git-core tar gzip zstd \
            alsa-lib-devel pulseaudio-libs-devel pipewire-devel dbus-devel ibus-devel systemd-devel libusb1-devel \
            libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXfixes-devel libXi-devel libXScrnSaver-devel \
            libxkbcommon-devel wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libGL-devel mesa-libEGL-devel libdrm-devel mesa-libgbm-devel

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.project }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.project }}-

      - name: Build and package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          source /opt/rh/gcc-toolset-14/enable
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=500M
          bash scripts/ci-build.sh "${{ matrix.project }}" linux out
          ccache -s

      - uses: actions/upload-artifact@v4
        if: matrix.project != '303-v1'
        with:
          name: ${{ matrix.project }}-linux
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows ${{ matrix.project }}
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 60
    steps:
      # Fedora has no MinGW libopenmpt: the 303 builds compile it from its pinned source release (cmake/libopenmpt.cmake).
      - name: Install packages
        run: |
          dnf -y install --setopt=install_weak_deps=False cmake ninja-build mingw64-gcc-c++ mingw64-binutils \
            mingw64-SDL3 mingw64-winpthreads-static ccache tar zstd

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.project }}-${{ github.sha }}
          restore-keys: ccache-windows-${{ matrix.project }}-

      - name: Build and package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$GITHUB_WORKSPACE" CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=500M
          bash scripts/ci-build.sh "${{ matrix.project }}" windows out
          ccache -s

      - uses: actions/upload-artifact@v4
        if: matrix.project != '303-v1'
        with:
          name: ${{ matrix.project }}-windows
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [plan, linux, windows]
    if: needs.plan.outputs.release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags and commits for the release notes
          filter: blob:none

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.plan.outputs.release }}-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-release.sh "$GITHUB_REF_NAME" out
